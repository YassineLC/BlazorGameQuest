server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Servir les fichiers statiques normalement
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Types de fichiers courants
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Désactiver le cache pour index.html afin d'éviter les problèmes de relâchements
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
