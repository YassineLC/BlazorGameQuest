services:
  # Service d'authentification
  auth-service:
    build:
      context: .
      dockerfile: src/AuthenticationServices/Dockerfile
    container_name: auth-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_HTTP_PORTS=8080
      - DISABLE_HTTPS_REDIRECTION=true
      - UseInMemoryDatabase=true
      - Keycloak__Authority=http://keycloak:8080/realms/blazorgamequest
      - Keycloak__ValidIssuer=http://localhost:8080/realms/blazorgamequest
    ports:
      - "5003:8080"
    networks:
      - blazor-game-network
    restart: unless-stopped

  # Service de jeu
  game-service:
    build:
      context: .
      dockerfile: src/GameService/Dockerfile
    container_name: game-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_HTTP_PORTS=8080
      - DISABLE_HTTPS_REDIRECTION=true
      - UseInMemoryDatabase=true
    ports:
      - "5002:8080"
    networks:
      - blazor-game-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_HTTP_PORTS=8080
      - DISABLE_HTTPS_REDIRECTION=true
      - UseInMemoryDatabase=true
      - Services__AuthService=http://auth-service:8080
      - Services__GameService=http://game-service:8080
      - Keycloak__Authority=http://keycloak:8080/realms/blazorgamequest
      - Keycloak__ValidIssuer=http://localhost:8080/realms/blazorgamequest
      - Keycloak__JwksUri=http://keycloak:8080/realms/blazorgamequest/protocol/openid-connect/certs
    ports:
      - "5001:8080"
    depends_on:
      - auth-service
      - game-service
    networks:
      - blazor-game-network
    restart: unless-stopped

  # Client Blazor
  blazor-client:
    build:
      context: .
      dockerfile: src/BlazorGame.Client/Dockerfile
    container_name: blazor-client
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_HTTP_PORTS=8080
      - ApiSettings__BaseUrl=http://api-gateway:8080
    ports:
      - "5000:8080"
    depends_on:
      - api-gateway
    networks:
      - blazor-game-network
    restart: unless-stopped

  # Keycloak Identity Provider
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev
    ports:
      - "8080:8080"
    depends_on:
      - postgres-keycloak
    networks:
      - blazor-game-network

  # Database for Keycloak
  postgres-keycloak:
    image: postgres:15
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - blazor-game-network

networks:
  blazor-game-network:
    driver: bridge

volumes:
  postgres_keycloak_data: